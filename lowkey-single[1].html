<script>
/* LOWKEY core – risk rules, calculations, mock AI and the API router.
   Used by server.js (Node) and, when no server is reachable, by the browser's offline demo store. */
(function(root){
const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h};
const last=a=>a[a.length-1],avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
function risk(s){const f=[],a=s.att;if(a[0]-last(a)>=15)f.push(`Attendance moved from ${a[0]}% to ${last(a)}% over 8 weeks`);const mi=s.m.slice(-4).filter(x=>!x).length;if(mi>=3)f.push(`${mi} of the last 4 assignments were not submitted`);if(s.q[0]-last(s.q)>=15)f.push(`Quiz scores moved from ${s.q[0]} to ${last(s.q)}`);if(s.lms[0]-last(s.lms)>=30)f.push(`LMS engagement index moved from ${s.lms[0]} to ${last(s.lms)}`);return{f,lvl:f.length>=3?'High':f.length==2?'Medium':f.length==1?'Watch':'On track'}}
const gp=m=>m>=90?10:m>=80?9:m>=70?8:m>=60?7:m>=50?6:5;
function plan(s){const R=s.sub.reduce((a,x)=>a+x[2],0),C=(s.s-1)*20,req=(s.t*(C+R)-s.cg*C)/R;return{R,C,req,ok:req<=10,sgpa:s.sub.reduce((a,x)=>a+gp(x[1])*x[2],0)/R}}
function summary(L,I){const n=L.length,lv=L.map(s=>risk(s).lvl),col=k=>n?L[0][k].map((_,i)=>avg(L.map(s=>s[k][i]))):[];
return{total:n,review:lv.filter(x=>x!='On track').length,high:lv.filter(x=>x=='High').length,att:avg(L.map(s=>last(s.att))),asg:avg(L.map(s=>s.m.reduce((a,b)=>a+b,0)/s.m.length*100)),
pending:I.filter(i=>i.status!='Completed').length,fu:I.filter(i=>i.fu&&i.status!='Completed').length,ints:I.length,done:I.filter(i=>i.status=='Completed').length,
dist:{High:lv.filter(x=>x=='High').length,Medium:lv.filter(x=>x=='Medium').length,Watch:lv.filter(x=>x=='Watch').length,'On track':lv.filter(x=>x=='On track').length},
w:{att:col('att'),lms:col('lms'),q:col('q'),asg:n?L[0].m.map((_,i)=>avg(L.map(s=>s.m[i]*100))):[]}}}
// Mock AI: templates only. All numbers come from verified records via risk()/plan().
function ai(k,s,q){const w=s.sub.slice().sort((a,b)=>a[1]-b[1]),r=risk(s),p=plan(s),t=w.reduce((a,x)=>a+100-x[1],0)||1;
const O={
plan:()=>'Weekly study plan (mock AI, 14 hours)\n'+w.map(x=>`• ${x[0]}: ${(14*(100-x[1])/t).toFixed(1)} h (current marks ${x[1]}%)`).join('\n')+'\n\nSuggested rhythm: weekdays 1.5 h after class; weekend 3.5 h revision; one practice quiz on Sunday.',
quiz:()=>`Practice quiz – ${w[0][0]} (mock AI)\n1. Define the key terms from your last lecture.\n2. Solve one worked example without notes.\n3. Explain one concept to a friend in 3 sentences.\n(Add approved course material for subject-specific questions.)`,
notes:()=>`Revision notes outline – ${w[0][0]} (mock AI)\n• Core definitions\n• 3 formulas/algorithms to memorise\n• Common mistakes\n• 5 self-test questions`,
cgpa:()=>p.ok?`Target ${s.t}: calculated need is ${p.req.toFixed(2)} semester GPA across ${p.R} credits. Priority subjects: ${w.slice(0,2).map(x=>x[0]).join(', ')}. No outcome is guaranteed.`:`Target ${s.t} needs ${p.req.toFixed(2)} in one semester, which is above the scale. Try a multi-semester goal.`,
chat:()=>`Mock AI: Let's break "${q}" into a definition, a simple example, and a practice question. Based on your records, ${w[0][0]} (${w[0][1]}%) may be worth extra time.`,
sum:()=>`Case summary – ${s.n} (draft, mock AI)\nObserved: CGPA ${s.cg} (target ${s.t}); attendance ${last(s.att)}%; ${s.m.filter(x=>!x).length} of 8 assignments missed.\nIndicators: ${r.f.join('; ')||'none'}.\nThese are prompts for a conversation, not predictions.`,
msg:()=>`Hi ${s.n.split(' ')[0]}, I noticed a few things in your recent coursework and wanted to check in – no pressure. Would you like to find a time to talk about how things are going and what would help?`,
brief:()=>`Meeting brief – ${s.n}\n1. Ask how the semester feels so far.\n2. Discuss: ${r.f.join('; ')||'steady progress'}.\n3. Explore obstacles and support options.\n4. Agree one small step and a follow-up date.`};
return O[k]?O[k]():null}
const TYPES=['Mentor meeting','Remedial class','Study support','Follow-up discussion'],STAT=['Pending','In Progress','Completed'];
/* API router: route(db, save, method, url, body, token) -> {status,data}. Role checks are enforced here, server-side. */

 if(method=='POST'){if(!ids.includes(b.sid))return E(400,'Choose one of your assigned students.');if(!TYPES.includes(b.type))return E(400,'Choose an intervention type.');if(!/^\d{4}-\d{2}-\d{2}$/.test(b.due||''))return E(400,'Choose a due date.');if(b.fu&&b.fu<b.due)return E(400,'Follow-up date must be on or after the due date.');
  const s=mine.find(x=>x.id==b.sid),i={id:Date.now(),sid:b.sid,type:b.type,due:b.due,fu:b.fu||'',notes:String(b.notes||'').trim().slice(0,500)||'(no notes)',status:'Pending',base:last(s.att),vis:b.vis?1:0};db.ints.push(i);save();return R(201,i)}
 if(method=='PATCH'){const i=myI.find(x=>x.id==id);if(!i)return E(404,'Intervention not found.');if(b.status!==undefined){if(!STAT.includes(b.status))return E(400,'Invalid status.');i.status=b.status;if(b.status=='Completed')i.after=last(mine.find(x=>x.id==i.sid).att)}if(b.outcome!==undefined)i.outcome=String(b.outcome).slice(0,500);save();return R(200,i)}}
if(p=='requests'){
 if(method=='GET')return R(200,db.reqs.filter(r=>ids.includes(r.sid)));
 if(M)return E(403,'Only students can send requests.');const t=String(b.t||'').trim().slice(0,500);if(!t)return E(400,'Please describe what you need.');const r={id:Date.now(),sid:me.sid,t,at:new Date().toISOString().slice(0,10)};db.reqs.push(r);save();return R(201,r)}
if(p=='ai'&&method=='POST'){const s=mine.find(x=>x.id==b.sid);if(!s)return E(403,'You do not have access to that student.');if(!M&&['sum','msg','brief'].includes(b.kind))return E(403,'Mentors only.');if(b.kind=='chat'&&!String(b.q||'').trim())return E(400,'Type a question first.');const t=ai(b.kind,s,String(b.q||'').slice(0,300));return t?R(200,{mock:true,text:t}):E(400,'Unknown request type.')}

return E(404,'Not found.')}
const C={hash,risk,gp,plan,summary,ai,route,seed:null};
if(typeof module!=='undefined')module.exports=C;else root.Core=C;
})(typeof window!=='undefined'?window:globalThis);

/* API client. Uses the LOWKEY server (/api/*) when reachable; otherwise falls back to an offline demo store
   (same router, data kept in this browser). The UI shows which mode is active. */
const API=(()=>{let mode=null,tok=null,mem=null;const clone=o=>JSON.parse(JSON.stringify(o));Core.seed=SEED;

function bars(a,c=P,h=150,labels,low){if(!a.length)return '<p class="l">No data yet.</p>';const w=340,L=32,B=20,bw=(w-L-8)/a.length,H=h-B-10,lab=labels||a.map((_,i)=>'W'+(i+1));
 const grid=[0,50,100].map(v=>{const y=10+H*(1-v/100);return `<line x1="${L}" x2="${w-6}" y1="${y}" y2="${y}" stroke="var(--b)"/>`+tx(L-5,y+3,v,'text-anchor="end"')}).join('');
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Bar chart, percent">${grid}${a.map((v,i)=>{const x=L+i*bw+4,y=10+H*(1-v/100),col=low!=null&&v<low?'#d97706':c;return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(bw-8,4).toFixed(1)}" height="${(H*v/100).toFixed(1)}" rx="3" fill="${col}"><title>${lab[i]}: ${v}%</title></rect>`+tx((x+(bw-8)/2).toFixed(1),(y-3).toFixed(1),v,'text-anchor="middle"')+tx((x+(bw-8)/2).toFixed(1),h-5,String(lab[i]).slice(0,8),'text-anchor="middle" font-size="8"')}).join('')}</svg>`}
function donut(d,total){const cols={High:'#dc2626',Medium:'#d97706',Watch:'#4f46e5','On track':'#15803d'},r=48,C=2*Math.PI*r,pc=v=>total?Math.round(v/total*100):0;let off=0;
 const seg=Object.keys(cols).map(k=>{const v=d[k]||0,len=total?v/total*C:0,mid=(-90+(off+len/2)/C*360)*Math.PI/180,e=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${cols[k]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"><title>${k}: ${v} of ${total} students (${pc(v)}%)</title></circle>`+(pc(v)>=8?`<text x="${(60+r*Math.cos(mid)).toFixed(1)}" y="${(60+r*Math.sin(mid)+3).toFixed(1)}" text-anchor="middle" font-size="8" font-weight="700" fill="#fff" style="pointer-events:none">${pc(v)}%</text>`:'');off+=len;return e}).join('');
 return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 120 120" width="150" role="img" aria-label="Review-level distribution in percent"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--b)" stroke-width="16"/>${seg}<text x="60" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="var(--t)">${pc(d['On track']||0)}%</text><text x="60" y="70" text-anchor="middle" font-size="7" fill="var(--m)">on track</text><text x="60" y="80" text-anchor="middle" font-size="6.5" fill="var(--m)">of ${total} students</text></svg><div>${Object.keys(cols).map(k=>`<div><span style="color:${cols[k]}">●</span> ${k}: <b>${d[k]||0}</b> <span class="l">(${pc(d[k]||0)}%)</span></div>`).join('')}</div></div>`}
const legend=(n,c)=>`<div class="leg">${n.map((x,i)=>`<span style="color:${c[i]}">● ${x}</span>`).join('')}</div>`;
const hb=(l,v,max,c='var(--p)')=>`<div style="margin:8px 0"><div class="top"><span>${l}</span><b>${v}</b></div><div class="bar"><i style="width:${max?v/max*100:0}%;background:${c}"></i></div></div>`;
const card=(k,l)=>`<div class="card"><div class="k">${k}</div><div class="l">${l}</div></div>`;

return `<div class="card"><h3>Weekly attendance (%)</h3>${line([s.att],[P],150,{thr:75,names:['Attendance']})}${note75}</div><div class="card"><h3>Quiz performance (score)</h3>${line([s.q],[O],150,{px:'Q',names:['Quiz score']})}</div><div class="card"><h3>Assignment completion so far (%)</h3>${bars(cum,P,150,null,50)}<p class="l">Amber bars: below 50%.</p></div><div class="card"><h3>LMS engagement index</h3>${line([s.lms],[B],150,{names:['LMS engagement']})}</div>`};

return head('Interventions','Suggestions need your approval. Nothing is sent or executed automatically.')+demo+`<div class="grid g2"><div class="card"><h3>Suggested interventions</h3>${sug.length?sug.map(([s,r])=>{const t=r.lvl=='High'?'Mentor meeting':r.f.some(x=>x.startsWith('Quiz'))?'Study support':'Follow-up discussion';return `<p><b>${s.n}</b> ${tag(r.lvl)}<br><span class="l">${r.f[0]}</span><br><button class="btn sm s" onclick="prefill('${s.id}','${t}')">Draft: ${t}</button></p>`}).join(''):'<p>No suggestions right now.</p>'}</div>
<div class="card"><h3>Record an intervention</h3><label for="is">Student</label><select id="is">${L.map(s=>`<option value="${s.id}">${s.n}</option>`).join('')}</select><label for="it">Type</label><select id="it">${['Mentor meeting','Remedial class','Study support','Follow-up discussion'].map(x=>`<option>${x}</option>`).join('')}</select><label for="id">Due date</label><input type="date" id="id"><label for="if">Follow-up date (optional)</label><input type="date" id="if"><label for="in">Notes (private to mentors)</label><textarea id="in" rows="3"></textarea><label style="font-weight:400"><input type="checkbox" id="iv" style="width:auto" checked> Show type and status to the student</label><div class="err" id="ie" role="alert"></div><button class="btn" type="button" onclick="addInt(event)">Save intervention</button></div></div>
<div class="grid g2"><div class="card"><h3>Pending tasks (${open.length})</h3>${open.length?'<ul>'+open.map(i=>`<li>${nm(i.sid)}: ${esc(i.type)}, due ${i.due}</li>`).join('')+'</ul>':'<p>Nothing pending.</p>'}</div><div class="card"><h3>Scheduled follow-ups</h3>${fu.length?'<ul>'+fu.map(i=>`<li>${nm(i.sid)}: ${i.fu}</li>`).join('')+'</ul>':'<p>No follow-ups scheduled.</p>'}</div></div>
<div class="card sc"><h3>Intervention log and recorded outcomes</h3>${I.length?`<table><tr><th>Student</th><th>Type</th><th>Due</th><th>Status</th><th>Outcome</th><th>Attendance before → now</th></tr>${I.map(i=>`<tr><td>${nm(i.sid)}</td><td>${esc(i.type)}<div class="l">${esc(i.notes)}</div></td><td>${i.due}${i.fu?'<div class="l">Follow-up '+i.fu+'</div>':''}</td><td><select aria-label="Status for ${nm(i.sid)}" onchange="setSt(${i.id},this.value)">${ST.map(x=>`<option ${i.status==x?'selected':''}>${x}</option>`).join('')}</select></td><td><input aria-label="Outcome for ${nm(i.sid)}" value="${esc(i.outcome||'')}" placeholder="Record outcome" onchange="setOut(${i.id},this.value)"></td><td>${i.base}% → ${last((sById(i.sid)||{att:[0]}).att)}%</td></tr>`).join('')}</table>`:'<p>No interventions yet. Use the form above to record one.</p>'}</div>
${I.length?`<div class="card" style="margin-top:14px"><h3>Attendance before support vs now</h3>${I.map(i=>hb(nm(i.sid)+' · before',i.base,100)+hb('now',last((sById(i.sid)||{att:[0]}).att),100,B)).join('')}<p class="l">A change does not prove the support caused it.</p></div>`:''}
<div class="card" style="margin-top:14px"><h3>Student support requests</h3>${reqs().length?reqs().map(r=>`<p>📨 <b>${nm(r.sid)}</b> (${r.at}): ${esc(r.t)}</p>`).join(''):'<p>No requests yet.</p>'}</div>`},
as(u){const L=mine(u);return head('AI Mentor Assistant','Drafts from verified data – you review before anything is sent.')+'<div class="demo">Mock AI mode – template-based drafts</div>'+`<div class="card"><div class="fl"><select id="as" aria-label="Student">${L.map(s=>`<option value="${s.id}">${s.n}</option>`).join('')}</select></div><div class="bar2"><button class="btn sm" onclick="draft('sum')">Case summary</button><button class="btn sm s" onclick="draft('msg')">Supportive message</button><button class="btn sm s" onclick="draft('brief')">Meeting brief</button></div><div class="out" id="mo">Select a student and choose a draft type.</div><label style="font-weight:400"><input type="checkbox" id="rv" style="width:auto"> I have reviewed this draft</label><button class="btn sm" onclick="sendD()">Mark ready to send</button><div class="err" id="me"></div></div>`},
fa(u){const L=mine(u),ds=[...new Set(L.map(s=>s.d))];return head('Fairness & Insights','Monitoring with honest limits.')+demo+`<div class="card sc"><h3>Review-flag rate by department</h3><table><tr><th>Dept</th><th>Students</th><th>Flagged for review</th><th>Rate</th></tr>${ds.map(d=>{const g=L.filter(s=>s.d==d),f=g.filter(s=>risk(s).lvl!='On track').length;return `<tr><td>${d}</td><td>${g.length}</td><td>${f}</td><td>${Math.round(f/g.length*100)}%</td></tr>`}).join('')}</table></div><div class="card" style="margin-top:14px"><h3>Limitations</h3><ul><li>Only ${L.length} fictional students; rates here say nothing about real populations.</li><li>Rules are hand-written and unvalidated; no accuracy or false-positive rates exist without real outcome labels.</li><li>Sensitive attributes are not used as inputs, but proxies (e.g. department) may still matter.</li><li>No fairness claim is made. Review with real data before any deployment.</li></ul></div>`},
tl(u){const L=mine(u);return head('Signal Timeline','Weekly signals: attendance below 75% or LMS index below 50 (demo thresholds).')+demo+`<div class="card sc"><table><tr><th>Student</th>${L[0].att.map((_,i)=>`<th>W${i+1}</th>`).join('')}</tr>${L.map(s=>`<tr><td>${s.n}</td>${s.att.map((a,i)=>{const n=(a<75)+(s.lms[i]<50);return `<td title="Att ${a}%, LMS ${s.lms[i]}" style="background:${['#dcfce7','#fef3c7','#fee2e2'][n]};color:#222;text-align:center">${n?'●'.repeat(n):'–'}</td>`}).join('')}</tr>`).join('')}</table></div>`},
se(u){return settings()}};
function go2(v){st.view=v;render()}
function dtRows(){const f=st.f,L=mine(sess()).filter(s=>(!f.q||s.n.toLowerCase().includes(f.q.toLowerCase()))&&(!f.d||s.d==f.d)&&(!f.s||s.s==f.s)&&(!f.r||(f.r=='ok')==(risk(s).lvl=='On track')));
return L.length?L.map(s=>`<tr><td><a href="#" onclick="st.sel='${s.id}';render();return false" style="color:var(--p);font-weight:600">${s.n}</a></td><td>${s.d}</td><td>${s.s}</td><td>${s.cg}</td><td>${last(s.att)}%</td><td>${tag(risk(s).lvl)}</td></tr>`).join(''):'<tr><td colspan="6">No students match these filters.</td></tr>'}
function dt(){$('#dt').innerHTML=dtRows()}
function prof(id){const s=sById(id);if(!s||s.mid!=sess().mid)return empty('No access','You can only open students assigned to you.');const r=risk(s),I=ints().filter(i=>i.sid==s.id),w=s.sub.slice().sort((a,b)=>a[1]-b[1]);
return `<button class="btn sm s" onclick="st.sel=null;paint()">← Back to directory</button>`+head(s.n,`ID ${s.id} · ${s.d} · Semester ${s.s} · CGPA ${s.cg} (target ${s.t})`)+demo+`<div class="grid g2"><div class="card"><h3>Explainable risk indicators ${tag(r.lvl)}</h3><b>Observed data</b><ul>${r.f.map(x=>`<li>${x}</li>`).join('')||'<li>No indicators currently.</li>'}</ul><p class="l">A prompt for a supportive conversation, not a prediction.</p></div>
<div class="card"><h3>Recommended next steps</h3><ul><li>${r.lvl=='On track'?'Share encouragement; no action needed.':'Offer a check-in this week to discuss workload and obstacles.'}</li><li>Review support options for ${w[0][0]} (${w[0][1]}%).</li><li>Agree a follow-up date once support is recorded.</li></ul></div>${chartCards(s)}
<div class="card sc"><h3>Internal assessment by subject</h3><table><tr><th>Subject</th><th>Marks</th><th>Credits</th></tr>${s.sub.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}%</td><td>${x[2]}</td></tr>`).join('')}</table></div>
<div class="card"><h3>Support history</h3>${I.length?I.map(i=>`<p>${esc(i.type)} · ${i.status} · due ${i.due}<br><span class="l">Attendance ${i.base}% → ${last(s.att)}% (does not prove cause)</span></p>`).join(''):'<p>No interventions recorded yet.</p>'}</div></div>`}

/* Mentor actions: record interventions, update status/outcomes, AI drafts. Mentors review everything; nothing is auto-sent. */
function prefill(sid,t){$('#is').value=sid;$('#it').value=t;$('#in').focus()}
async function addInt(e){e&&e.preventDefault&&e.preventDefault();const sid=$('#is').value,d=$('#id').value,f=$('#if').value;if(!sid)return $('#ie').textContent='Choose a student.';if(!d)return $('#ie').textContent='Choose a due date.';if(f&&f<d)return $('#ie').textContent='Follow-up date must be on or after the due date.';
 try{await API.call('POST','api/interventions',{sid,type:$('#it').value,due:d,fu:f,notes:$('#in').value,vis:$('#iv').checked});toast('Intervention saved.');await render()}catch(x){$('#ie').textContent=x.message}}
async function setSt(id,v){try{await API.call('PATCH','api/interventions/'+id,{status:v});toast('Status updated.');await render()}catch(x){toast(x.message)}}
async function setOut(id,v){try{await API.call('PATCH','api/interventions/'+id,{outcome:v});toast('Outcome saved.');await render()}catch(x){toast(x.message)}}
async function draft(k){const sid=$('#as').value;if(!sid)return;$('#mo').textContent='Generating draft…';try{const r=await API.call('POST','api/ai',{kind:k,sid});$('#mo').textContent=r.text+'\n\n[Mock AI draft – review before use]';$('#rv').checked=false}catch(x){$('#mo').textContent='The AI assistant is temporarily unavailable. Please try again shortly. ('+x.message+')'}}
function sendD(){$('#me').textContent=$('#rv').checked?'Marked ready. (Demo: nothing is actually sent.)':'Review the draft and tick the box first.'}

/* Settings, theme and start-up. */
async function resetDemo(){try{await API.call('POST','api/reset');toast('Demo data reset.');await render()}catch(x){toast(x.message)}}
function settings(){const u=sess();return head('Settings','Account and display preferences.')+`<div class="card"><p>Signed in as <b>${esc(u.u)}</b> (${u.role}).</p><div class="bar2"><button class="btn sm s" onclick="tg()">Toggle light/dark mode</button>${u.role=='mentor'?'<button class="btn sm s" onclick="resetDemo()">Reset demo data</button>':''}</div><p class="l">Prototype notice: demo authentication (simple hashes, in-memory sessions) is not production security. All data is fictional.</p></div>`}
function tg(){const d=document.documentElement,n=d.dataset.theme=='dark'?'light':'dark';d.dataset.theme=n;ls('lk_th',n)}
document.documentElement.dataset.theme=ls('lk_th')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
boot();

</script></body></html>
